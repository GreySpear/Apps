<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Waypoint</title>
  <meta name="description" content="Offline-first travel planner. Import a trip, carry it anywhere.">
  <meta name="theme-color" content="#157071" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E5253" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Waypoint">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <button class="brand" id="brand" aria-label="Waypoint home">
      <span class="brand-pin" aria-hidden="true"></span>
      <span class="brand-name">Way<span>point</span></span>
    </button>
    <div class="topbar-right" id="topbar-right"></div>
  </header>

  <main id="app" role="main"><!-- views render here --></main>

  <nav id="tabbar" class="tabbar" aria-label="Trip sections" hidden></nav>

  <!-- lightweight full-screen viewer for docs -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
    <div class="lightbox-body" id="lightbox-body"></div>
  </div>

  <!-- generic modal / bottom-sheet (help, import) -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title" class="display"></h2>
        <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- transient toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- hidden file inputs -->
  <input type="file" id="import-input" accept="application/json,.json" hidden>
  <input type="file" id="doc-input" accept="image/*,application/pdf" multiple hidden>

  <script src="app.js"></script>
</body>
</html>
